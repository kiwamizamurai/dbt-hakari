name: CI

# Kept small on purpose: one Linux job per end of the supported Python range. It also runs when the
# docs change, because a test checks that no real project or person name slips into them.
on:
  push:
    branches: [main]
    paths: &paths
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "*.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *paths

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest
